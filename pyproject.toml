[project]
name = "ic-data-bot"
version = "0.1.0"
description = "Bot Discord manager de la donnee Infoclimat"
requires-python = ">=3.14"
dependencies = [
    "discord.py>=2.4",
    "anthropic>=0.40",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "aiohttp>=3.10",
    "mistralai>=2.4.9",
    "langfuse>=4.7.1",
]

[project.scripts]
ic-data-bot = "ic_data_bot.bot:run"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ic_data_bot"]
